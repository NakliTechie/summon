<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="820" viewBox="0 0 680 410" role="img" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <title>Summon two-app architecture</title>
  <desc>Summon stays a fast launcher; a separate companion app provides chat and a general-purpose assistant, talking to Summon's core over the agent socket. Both share one local store and draw on an AI ladder and a search ladder. Built pieces are solid teal; proposed pieces are dashed amber.</desc>
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#64748B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="410" fill="#FFFFFF"/>
  <text x="340" y="34" text-anchor="middle" font-size="18" font-weight="600" fill="#0F172A">Summon — two-app architecture</text>

  <line x1="190" y1="138" x2="300" y2="180" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#arw)"/>
  <line x1="490" y1="138" x2="420" y2="180" fill="none" stroke="#64748B" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arw)"/>
  <line x1="178" y1="208" x2="204" y2="208" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#arw)"/>
  <line x1="502" y1="208" x2="476" y2="208" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#arw)"/>
  <line x1="340" y1="246" x2="340" y2="312" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#arw)"/>
  <text x="455" y="164" text-anchor="middle" font-size="11.5" fill="#475569">agent socket · off</text>

  <rect x="90" y="84" width="200" height="54" rx="9" fill="#0F766E"/>
  <text x="190" y="110" text-anchor="middle" font-size="15" font-weight="600" fill="#FFFFFF">Summon launcher</text>
  <text x="190" y="128" text-anchor="middle" font-size="12" fill="#CCFBF1">⌥Space · fast · no chat</text>

  <rect x="390" y="84" width="200" height="54" rx="9" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="490" y="110" text-anchor="middle" font-size="15" font-weight="600" fill="#92400E">Companion app</text>
  <text x="490" y="128" text-anchor="middle" font-size="12" fill="#B45309">chat · GP assistant</text>

  <rect x="40" y="184" width="138" height="56" rx="9" fill="#EEF2FF" stroke="#6366F1" stroke-width="1"/>
  <text x="109" y="209" text-anchor="middle" font-size="14" font-weight="600" fill="#3730A3">AI ladder</text>
  <text x="109" y="227" text-anchor="middle" font-size="11.5" fill="#4F46E5">L1 Apple FM · L0 Gemma</text>

  <rect x="206" y="180" width="268" height="64" rx="9" fill="#115E59"/>
  <text x="340" y="208" text-anchor="middle" font-size="15" font-weight="600" fill="#FFFFFF">Summon core</text>
  <text x="340" y="228" text-anchor="middle" font-size="12" fill="#CCFBF1">action bus · journaled store</text>

  <rect x="502" y="184" width="138" height="56" rx="9" fill="#EEF2FF" stroke="#6366F1" stroke-width="1"/>
  <text x="571" y="209" text-anchor="middle" font-size="14" font-weight="600" fill="#3730A3">Search ladder</text>
  <text x="571" y="227" text-anchor="middle" font-size="11.5" fill="#4F46E5">Spotlight · SearXNG</text>

  <rect x="206" y="314" width="268" height="54" rx="9" fill="#0F766E"/>
  <text x="340" y="340" text-anchor="middle" font-size="15" font-weight="600" fill="#FFFFFF">Local store (SQLite)</text>
  <text x="340" y="358" text-anchor="middle" font-size="12" fill="#CCFBF1">clipboard + images · snippets</text>

  <rect x="206" y="388" width="14" height="12" rx="3" fill="#0F766E"/>
  <text x="226" y="398" font-size="11.5" fill="#334155">built / decided</text>
  <rect x="352" y="388" width="14" height="12" rx="3" fill="#FEF3C7" stroke="#D97706" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="372" y="398" font-size="11.5" fill="#334155">proposed</text>
</svg>
