name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: make verify
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Install SwiftLint and ripgrep
        run: brew install swiftlint ripgrep
      - name: Verify
        run: make verify
