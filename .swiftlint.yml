# SwiftLint (handoff §8.7). Strict on safety/style that matters; not pedantic on
# single-letter pattern-match bindings or Package.swift commas.

included:
  - Sources
  - Tests

excluded:
  - .build
  - .worktrees
  - plan
  - Package.swift

disabled_rules:
  - trailing_whitespace
  - trailing_comma
  - todo
  - orphaned_doc_comment
  - identifier_name
  - type_name
  - nesting
  - non_optional_string_data_conversion
  - large_tuple

opt_in_rules:
  - empty_count
  - fatal_error_message
  - first_where
  - overridden_super_call
  - prohibited_super_call
  - yoda_condition

line_length:
  warning: 140
  error: 200
  ignores_comments: true
  ignores_urls: true

file_length:
  warning: 600
  error: 900

type_body_length:
  warning: 500
  error: 900

function_body_length:
  warning: 100
  error: 200

cyclomatic_complexity:
  warning: 30
  error: 50

reporter: "xcode"
